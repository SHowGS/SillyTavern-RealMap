<div class="realmap_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>现实地图</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small>接入高德地图 JS API 2.0，为角色扮演注入真实地理位置、天气、路线与 POI 上下文。请在 https://console.amap.com/dev/key 申请 Key 与安全密钥。</small>

            <div class="realmap_version_row">
                <div class="realmap_version_info">
                    <span>版本</span>
                    <span id="realmap_version_value" aria-live="polite">正在检查...</span>
                </div>
                <button class="menu_button" id="realmap_update_btn" type="button" disabled>
                    <i class="fa-solid fa-download fa-fw"></i>
                    <span>检查中...</span>
                </button>
            </div>

            <hr>

            <!-- 启用现实地图（仅当有聊天打开时显示） -->
            <div id="realmap_enable_block" style="display:none">
                <div class="menu_button" id="realmap_enable_btn">启用现实地图</div>
            </div>

            <!-- API 配置面板 -->
            <div>
                <label for="realmap_key">高德 JS API Key</label>
                <input id="realmap_key" class="text_pole" type="password" autocomplete="off" placeholder="Web端 (JS API) Key" />
                <label for="realmap_security_code">安全密钥 (securityJsCode)</label>
                <input id="realmap_security_code" class="text_pole" type="password" autocomplete="off" placeholder="securityJsCode" />

                <div class="menu_button" id="realmap_test_connection">测试连接</div>

                <hr>

                <b>LLM API 配置</b>
                <small>用于主模型回复前的移动意图判断，以及回复后的最终位置解析（OpenAI兼容接口）。</small>

                <label for="realmap_llm_source">API 类型</label>
                <select id="realmap_llm_source" class="text_pole">
                    <option value="openai">OpenAI</option>
                    <option value="openrouter">OpenRouter</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="custom">自定义 (OpenAI 兼容)</option>
                </select>

                <div id="realmap_llm_custom_url_block">
                    <label for="realmap_llm_custom_url">Base URL</label>
                    <input id="realmap_llm_custom_url" class="text_pole" type="text" autocomplete="off" placeholder="https://api.example.com/v1" />
                </div>

                <label for="realmap_llm_api_key">API Key</label>
                <input id="realmap_llm_api_key" class="text_pole" type="password" autocomplete="off" placeholder="sk-..." />

                <div class="flex-container justifySpaceBetween">
                    <label for="realmap_llm_model" class="flex1">模型</label>
                    <div class="menu_button margin0 padding0" id="realmap_llm_refresh_models">获取模型</div>
                </div>
                <select id="realmap_llm_model" class="text_pole">
                    <option value="">（点击右侧按钮获取）</option>
                </select>
            </div>

        </div>
    </div>
</div>
